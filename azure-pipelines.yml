# ADO Pipeline: Deploy faf-site to Cloudflare Pages
# Triggers on every push to main. Requires variable group "faf-cloudflare"
# with CF_API_TOKEN and CF_ACCOUNT_ID (both marked secret).
# See docs/deployment.md for setup instructions and manual fallback.

trigger:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: faf-cloudflare

steps:
  - checkout: self
    fetchDepth: 1

  - task: NodeTool@0
    displayName: "Install Node.js 20.x"
    inputs:
      versionSpec: "20.x"

  - script: npm install -g wrangler
    displayName: "Install Wrangler CLI"

  - script: |
      wrangler pages deploy . \
        --project-name=faf-site \
        --branch=main \
        --commit-dirty=true
    displayName: "Deploy to Cloudflare Pages"
    env:
      CLOUDFLARE_API_TOKEN: $(CF_API_TOKEN)
      CLOUDFLARE_ACCOUNT_ID: $(CF_ACCOUNT_ID)

  - script: |
      echo "Deploy completed successfully."
      echo "To sync the GitHub archive mirror, run locally:"
      echo "  git push github-archive main"
    displayName: "Post-deploy note"
    condition: succeeded()
