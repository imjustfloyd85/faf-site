# TEMPORARY STOPGAP — re-enabled 2026-07-28 with Floyd's explicit approval.
# Long-term deployment is meant to move to Azure Pipelines
# (azure-pipelines.yml), but that pipeline cannot be created yet --
# it needs an ADO Pipelines variable group ("faf-cloudflare") and
# pipeline resource that require ADO permissions beyond the current
# automation token. Until that one-time setup happens, this manual
# workflow_dispatch path is the only working deploy route. Re-disable
# (set jobs.deploy.if back to false) once the Azure Pipeline is live.
#
# See docs/deployment.md for the intended long-term strategy.

name: Deploy to Cloudflare Pages (manual stopgap)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy . --project-name=faf-site --branch=main --commit-dirty=true
