# DEPRECATED — deployment moved to Azure Pipelines (azure-pipelines.yml).
# ADO is the single deploy source. This workflow is disabled.
# See docs/deployment.md for the current deploy architecture.
#
# History:
#   - Originally the primary deploy path (Cloudflare Pages via GH Actions)
#   - 2026-07-28: Re-enabled as manual stopgap while ADO pipeline setup was pending
#   - 2026-09-16: Disabled permanently as part of ADO #1241 deployment alignment
#
# DO NOT re-enable. If ADO pipeline is down, use the manual wrangler
# deploy documented in docs/deployment.md instead.

name: "[DEPRECATED] Deploy to Cloudflare Pages"

on:
  workflow_dispatch:

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy . --project-name=faf-site --branch=main --commit-dirty=true
